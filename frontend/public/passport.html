function badge(s){const v=String(s??''),cls=/отказ|отклон|забрак|отмен/i.test(v)?'red':/уточнен|замечан|ожида|не провер|на провер|отсутств|устранение заявлено/i.test(v)?'warn':/^(подтвержден|согласован|принят|получено$|выполнено|готово|изготовлено|закрыто|проверено|завершен)/i.test(v)?'green':/зарегистр|черновик|не отправлено/i.test(v)?'gray':'';return `<span class="badge ${cls}">${esc(v)}</span>`}
function btn(s,fn,cls=''){return `<button class="${cls}" onclick="${fn}">${s}</button>`}function go(p){if(!canPage(p))return toast('Раздел недоступен вашей роли');if(p!==homePage()&&!canProject(state))return toast('Проект недоступен вашей организации');if(p===homePage())projectQuery='';page=p;tab='overview';query='';filter='Все';render()}function openItem(id){if(!visibleItems().some(x=>x.id===id))return toast('Нет доступа к конструкции');selected=id;go('passport')}

function passport(){let x=I(),n=completeness(x),tabs=[['overview','Обзор паспорта'],['spec','Характеристики'],['docs','Документы'],['quality','Контроль качества'],['events','История']];return title('Цифровой паспорт',`${esc(state.project)} · Корпус 1 · ${esc(x.floor)}`,btn('Печать','window.print()')+btn('QR и идентификаторы','qr()','primary'))+`<div class="grid passport-grid"><section class="panel">${model()}<div class="pad"><div class="flex between"><div><small>Проектная конструкция</small><h2 style="margin-top:5px">Колонна ${esc(x.mark)} <span class="muted" style="font-weight:400">/ ${x.id}</span></h2></div>${badge(x.production)}</div><div class="kv"><div><span>Расположение</span><b>Корпус 1 · ${esc(x.floor)} · оси А/${state.items.indexOf(x)+1}</b></div><div><span>IFC GlobalId</span><b style="font-family:monospace">2zLJtX9pF7hQ${x.id.slice(-4)}</b></div></div></div></section><section class="panel pad"><div class="flex between"><h2>Паспорт конструкции</h2><span class="badge gray">Версия ${viewVersion()}.0</span></div><div class="kv"><div><span>Заказ</span><b>${state.order.number}</b></div><div><span>Производитель</span><b>Завод ЖБИ «Урал»</b></div><div><span>Заводской номер</span><b>${x.factory||'Не зарегистрирован'}</b></div><div><span>ID физического изделия</span><b>${x.physical||'Не присвоен'}</b></div><div><span>Производственная партия</span><b>${x.batch||'Не указана'}</b></div><div><span>Требования в заказе</span><b>${esc(state.order.docs)}</b></div></div><div class="divider"></div><div class="flex between"><h3>Комплектность сведений</h3><b>${Math.round(n/7*100)}%</b></div><div class="progress"><i style="width:${n/7*100}%"></i></div><small>${n} из 7 обязательных пунктов · не оценка прочности</small><div class="hint ${n<7?'warn':''}" style="margin-top:16px">${n<7?'Требует внимания: '+missing(x).join(', '):'Обязательные сведения заполнены. Решение о качестве принимает ТХЗ.'}</div><div class="divider"></div><div class="flex wrap">${badge(x.receipt)}${badge(x.quality)}</div></section></div><div class="steps">${['Проект','Заказ согласован','Изготовление','Поставка','Приёмка'].map((s,i)=>`<div class="step ${i<2||i===2&&x.qualityDoc||i===3&&x.receipt.startsWith('Получено')||i===4&&x.quality==='Принято'?'done':''}">${String(i+1).padStart(2,'0')}　${s}</div>`).join('')}</div><div class="tabs">${tabs.map(([v,l])=>btn(l,`tab='${v}';render()`,tab===v?'active':'')).join('')}</div>${tab==='overview'?overview(x):tab==='spec'?spec(x):tab==='docs'?docsPanel():tab==='quality'?qualityPanel(x):eventPanel(x.id)}`}
function missing(x){let a=[];if(!x.factory)a.push('заводской номер');if(!x.batch)a.push('партия');if(!['Изготовлено','Готово к отгрузке'].includes(x.production))a.push('подтверждение изготовления');if(!x.marked)a.push('маркировка');if(!x.qualityDoc)a.push('паспорт качества');if(!x.test)a.push('обязательный протокол');if(state.issues.some(z=>z.item===x.id&&z.status!=='Закрыто'))a.push('открытое замечание');return a}

function modal(name,body,submit,label='Сохранить'){
 const d=$('#modal'),epoch=sessionEpoch,ownerRole=role,project=activeProject,check=actionCheck;
 d.innerHTML=`<form id="modalForm"><div class="modalhead"><h2>${name}</h2><button type="button" aria-label="Закрыть" onclick="$('#modal').close()" class="small">✕</button></div><div class="modalbody">${body}</div><div class="modalfoot"><button type="button" onclick="$('#modal').close()">Закрыть</button>${submit?`<button class="primary" type="submit">${label}</button>`:''}</div></form>`;
 const nameAtOpen=actionName;
 $('#modalForm').onsubmit=e=>{e.preventDefault();if(!submit)return;const previous=actionCheck,previousName=actionName;try{if(epoch!==sessionEpoch||role!==ownerRole||activeProject!==project)throw Error('Аккаунт или проект изменён. Откройте действие заново.');if(check)check();actionCheck=check;actionName=nameAtOpen;let result=submit(new FormData(e.target));if(result!==false){d.close();render()}}catch(err){toast(err.message)}finally{actionCheck=previous;actionName=previousName}};
 if(!d.open)d.showModal();
}

function protect(key,fn,validate=()=>{}){
 return function(...args){const check=()=>{requireAction(typeof key==='function'?key(...args):key);validate(...args)};const previous=actionCheck,previousName=actionName;

 }
}

function orderItems(){return visibleItems().filter(x=>state.order.itemIds.includes(x.id))}
let notificationFilter='all';
function notificationDestination(action,text,item){
 if(action?.startsWith('order.')||/заказ.*(соглас|направ|создан)|решение по.*(change|cancel|clarify)/i.test(text))return {page:'orders'};
 if(action?.startsWith('issue.')||action?.startsWith('replacement.')||/замечан|замен|ЗМ-/i.test(text))return {page:'issues',item};
 if(action==='shipment.create'||action==='receipt.confirm'||/отправлено|отгрузк|получение:/i.test(text))return {page:'shipments',item};
 if(action==='quality.decide'||/качество:/i.test(text))return {page:'passport',tab:'quality',item};
 if(action==='document.upload'||action==='document.verify'||/документ|паспорт качества|протокол/i.test(text))return item?{page:'passport',tab:'docs',item}:{page:'documents'};
 if(action==='test.add')return {page:'tests',item};
 if(action?.startsWith('project.'))return {page:'projects'};
 return item?{page:'passport',tab:'events',item}:{page:'orders'};
}
function switchOrder(id){const o=state.orders.find(o=>o.id===id);if(!o||factory()&&(o.factoryOrgId!==users.factory.orgId||o.status==='Черновик'))return toast('Нет доступа к заказу');sessionEpoch++;$('#modal').close();state.order=o;state.activeOrderId=o.id;selected=visibleItems()[0]?.id;save();page='orders';tab='overview';render()}
function switchOrder(id){const o=state.orders.find(o=>o.id===id);if(!o||factory()&&(o.factoryOrgId!==users.factory.orgId||o.status==='Черновик'))return toast('Нет доступа к заказу');sessionEpoch++;$('#modal').close();state.order=o;state.activeOrderId=o.id;selected=visibleItems()[0]?.id;save();page='orders';tab='overview';render()}
function notificationRows(){if(!role)return [];const result=[];for(const [projectId,d] of Object.entries(portfolio.projects)){if(!canProject(d))continue;const ids=new Set(itemsFor(d).map(x=>x.id));for(const e of d.notifications||[]){if(factory()&&e.visibility==='customer'||e.item&&!ids.has(e.item))continue;e.id=e.id||uid('NOTICE');e.readBy=e.readBy||{};if(e.userId===users[role].userId||!e.userId&&e.user===users[role].name)e.readBy[users[role].userId]=true;result.push({projectId,project:d.project,event:e})}}return result.sort((a,b)=>(b.event.createdAt||0)-(a.event.createdAt||0))}
function unreadNotifications(){return notificationRows().filter(n=>!n.event.readBy[users[role].userId])}
function notificationButton(){const n=unreadNotifications().length;return `<button class="small notification-trigger ${n?'has-unread':''}" onclick="go('notifications')" aria-label="Уведомления${n?': непрочитанных '+n:''}"><span aria-hidden="true">♧</span><span class="notification-label">Уведомления</span>${n?`<span class="notification-count">${n}</span>`:''}</button>`}
function notificationTarget(n){const e=n.event,t={...(e.destination||notificationDestination(null,e.text,e.item))};if(t.page==='tests'&&!factory())t.page='documents';if(t.page==='projects'&&factory())t.page='orders';if(!canPage(t.page))t.page=e.item?'passport':'orders';if(t.page==='passport'&&!itemsFor(portfolio.projects[n.projectId]).some(x=>x.id===(t.item||e.item)))t.page='orders';return t}
function targetLabel(t){return t.page==='passport'?(t.tab==='docs'?'Документы изделия':t.tab==='quality'?'Качество изделия':'История изделия'):({orders:'Перейти к заказу',issues:'Перейти к замечаниям',shipments:factory()?'Открыть отгрузки':'Открыть получение',documents:'Открыть документы',tests:'Открыть испытания',projects:'Открыть проект'})[t.page]||'Открыть'}
function markNotice(projectId,id){const n=notificationRows().find(n=>n.projectId===projectId&&n.event.id===id);if(!n)return toast('Уведомление недоступно');n.event.readBy[users[role].userId]=true;save();render()}

function notifications(){const all=notificationRows(),rows=notificationFilter==='unread'?all.filter(n=>!n.event.readBy[users[role].userId]):all;return title('Уведомления',`По всем доступным ${factory()?'заказам':'проектам'} · непрочитанных: ${unreadNotifications().length}`,unreadNotifications().length?btn('Прочитать все','markAllNotices()'):'')+`<div class="toolbar">${btn('Все',"notificationFilter='all';render()",notificationFilter==='all'?'primary':'')}${btn('Непрочитанные',"notificationFilter='unread';render()",notificationFilter==='unread'?'primary':'')}</div><div class="grid">${rows.map(n=>{const e=n.event,unread=!e.readBy[users[role].userId],t=notificationTarget(n);return `<article class="panel pad notification-card ${unread?'unread':''}"><div class="flex between wrap"><small>${esc(n.project)}${e.item?' · '+esc(e.item):''}</small>${unread?'<span class="notification-new">● Новое</span>':'<span class="muted">Прочитано</span>'}</div><h3 style="margin-top:10px">${esc(e.text)}</h3><p class="muted">${esc(e.user)} · ${esc(e.org)}<br>${esc(e.time)}</p><div class="flex wrap">${btn(targetLabel(t),`openNotice('${n.projectId}','${e.id}')`,'primary small')}${unread?btn('Отметить прочитанным',`markNotice('${n.projectId}','${e.id}')`,'small'):''}</div></article>`}).join('')||'<div class="panel empty">'+(notificationFilter==='unread'?'Непрочитанных уведомлений нет':'Уведомлений пока нет')+'</div>'}</div>`}


function eventAppearance(e){const t=e.text||'',a=e.action||'',final=t.includes('→')?t.slice(t.lastIndexOf('→')+1).split(';')[0].trim():t;let tone='gray';
 if(a==='issue.close')tone='green';
 else if(['issue.create','issue.answer','issue.reopen','replacement.request','order.clarify'].includes(a))tone='warn';
 else if(['production.manufacture','production.ready','mark.restore','order.confirm','replacement.apply'].includes(a))tone='green';
 else if(/отказ|отклон|забрак|отменён|отменен/i.test(final))tone='red';
 else if(/уточнен|замечан|устранение заявлено|вернуто|возвращено|предложена замена|предложение|запрос.*(change|cancel|clarify)/i.test(final))tone='warn';
 else if(/подтвержден|согласован|принято|получено|закрыл|готовност|изготовление|устранение подтвержден/i.test(final))tone='green';
 return {tone,icon:{green:'✓',red:'×',warn:'!',gray:'i'}[tone],label:{green:'Подтверждено',red:'Отказ / отмена',warn:'Требует внимания',gray:'Информация'}[tone]};}
