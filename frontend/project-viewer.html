<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Digital Passport · модель проекта</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; font: 14px Arial, sans-serif; color: #24344a; }
    #scene { width: 100%; height: 100%; background: #eaf0f6; }
    .panel { position: absolute; z-index: 2; left: 16px; top: 16px; right: 16px; display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; pointer-events: none; }
    .info, .controls { background: #fffffff0; border: 1px solid #d7e0e9; border-radius: 9px; box-shadow: 0 4px 16px #17304a19; padding: 11px 13px; pointer-events: auto; }
    .info { min-width: 0; max-width: 70%; }
    .info strong, .info small { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .info small { color: #64758b; margin-top: 4px; }
    .controls { display: flex; gap: 7px; }
    button { cursor: pointer; border: 1px solid #c4cfda; background: #fff; border-radius: 6px; color: #183459; padding: 6px 9px; white-space: nowrap; }
    button:hover { background: #e8f0f9; }
    #status { position: absolute; z-index: 2; left: 16px; bottom: 16px; right: 16px; width: fit-content; max-width: calc(100% - 32px); padding: 9px 12px; border-radius: 7px; background: #10233ce8; color: white; }
  </style>
</head>
<body>
  <div id="scene"></div>
  <div class="panel"><div class="info"><strong id="element-name">Вся модель проекта</strong><small id="element-meta"></small></div><div class="controls"><button id="fit" type="button">Вписать</button><button id="wire" type="button">Каркас</button></div></div>
  <div id="status" role="status">Загрузка IFC-модели…</div>
  <script type="module" src="/src/project-viewer.js"></script>
</body>
</html>
